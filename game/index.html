<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Court of Embers: an original duel card game. Four elements, one table, twenty life each — outplay the Ember Court's champion.">
<title>Court of Embers — a duel card game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c0a12;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
  }
  #wrap {
    text-align: center;
  }
  canvas {
    display: block;
    width: 1280px;
    height: 800px;
    max-width: 100vw;
    max-height: 100vh;
    background: #14261c;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.85);
  }
  #note {
    color: #8a8272;
    font-size: 13px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="note">Court of Embers — an original duel card game. No network, no tracking, just you and the champion.</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
