<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Court of Embers is an original duel card game: four elements, one table, twenty life each. Play it offline in a desktop browser.">
<title>Court of Embers — a duel card game</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0c0a12; font-family: Georgia, 'Times New Roman', serif; overflow: hidden; }
  main { min-height: 100vh; display: block; }
  .table { line-height: 0; margin: 0 auto; width: fit-content; }
  .table canvas { display: block; width: 1280px; height: 800px; max-width: 100vw; max-height: 100vh; background: #14261c; box-shadow: 0 0 60px rgba(0, 0, 0, 0.85); }
  .caption { line-height: 1.4; color: #8a8272; font-size: 13px; text-align: center; padding-top: 8px; }
  noscript p { color: #f7f1de; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="table">
    <canvas id="game" width="1280" height="800"></canvas>
    <div class="caption">Court of Embers — an original duel card game. No network, no tracking, just you and the champion.</div>
  </div>
</main>
<noscript><p>Court of Embers needs JavaScript to play.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
